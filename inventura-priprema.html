<!DOCTYPE html>
<html lang="hr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Prijem Robe - Nova inventura</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="icon" href="icons/favicon.png" type="image/png">
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#007aff">
  <style>
    @media(max-width:500px){
      .page-header{flex-wrap:wrap;gap:8px}
      .page-header .title-group h1{font-size:18px}
    }
    .part-item{display:flex;align-items:center;gap:10px;padding:10px 14px;background:var(--bg-white);border:1px solid var(--border);border-radius:10px;margin-bottom:6px}
    .part-item .part-name{flex:1;font-weight:600;font-size:14px}
    .part-item button{background:none;border:none;color:var(--danger);cursor:pointer;font-size:14px}
  </style>
</head>
<body>
  <script>if(localStorage.getItem("theme")==="dark")document.documentElement.setAttribute("data-theme","dark");</script>
  <div class="app">
    <div class="page-header">
      <button class="back-btn" onclick="window.location.href='dashboard.html'">&#8592;</button>
      <div class="title-group"><h1>&#128203; Nova inventura</h1><p id="pn"></p></div>
      <div class="header-action" style="display:flex;gap:6px;align-items:center">
        <div class="theme-toggle" id="theme-toggle" onclick="var d=document.documentElement.getAttribute('data-theme')==='dark';if(d){document.documentElement.removeAttribute('data-theme');this.classList.remove('dark');localStorage.setItem('theme','light')}else{document.documentElement.setAttribute('data-theme','dark');this.classList.add('dark');localStorage.setItem('theme','dark')}"></div>
        <button id="save-btn" class="btn btn-success btn-sm" disabled>&#128190; Spremi</button>
      </div>
    </div>

    <!-- Naziv -->
    <div style="margin-bottom:14px">
      <input type="text" id="inv-naziv" placeholder="Naziv inventure (npr. Inventura travanj 2026)" style="width:100%;padding:12px 14px;background:var(--bg-white);border:1.5px solid var(--border);border-radius:10px;font-size:15px;font-family:var(--font);color:var(--text);outline:none">
    </div>

    <!-- Upload -->
    <div id="upload-zone" class="upload-zone">
      <div class="upload-icon">&#128196;</div><h3>Ucitaj popis artikala (PDF ili Excel)</h3><p>Povuci datoteke ovdje ili klikni za odabir</p>
      <input type="file" id="fi" accept=".pdf,.xlsx,.xls,.csv" multiple style="display:none">
    </div>

    <div id="fl" style="margin:16px 0;display:none">
      <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:8px">
        <span style="font-size:13px;color:var(--text-secondary);font-weight:500">Ucitani dokumenti:</span>
        <button id="add-more" class="btn btn-secondary btn-sm">+ Dodaj dokument</button>
      </div>
      <div id="ft" style="display:flex;flex-wrap:wrap;gap:6px"></div>
    </div>

    <div id="pl" style="display:none;text-align:center;padding:40px"><div style="font-size:32px" class="loading">&#9881;</div><p style="color:var(--text-secondary);margin-top:8px">Ucitavam...</p></div>

    <!-- Articles summary -->
    <div id="is" style="display:none">
      <div style="font-size:14px;color:var(--text-secondary);margin-bottom:12px">Ukupno: <strong id="ti" style="color:var(--text)">0</strong> artikala, <strong id="tq" style="color:var(--text)">0</strong> komada</div>
    </div>

    <!-- Parts / Dijelovi -->
    <div id="parts-section" style="display:none;margin-top:16px">
      <div style="font-size:16px;font-weight:700;margin-bottom:10px">Dijelovi inventure (skeneri)</div>
      <p style="font-size:12px;color:var(--text-muted);margin-bottom:12px">Svaki dio dobiva istu listu artikala. Svaki skener otvara svoj dio.</p>
      <div id="parts-list"></div>
      <div style="display:flex;gap:8px;margin-top:8px">
        <input type="text" id="new-part" placeholder="Naziv dijela (npr. Skener 1, Polica A...)" style="flex:1;padding:10px 12px;background:var(--bg-white);border:1.5px solid var(--border);border-radius:10px;font-size:14px;font-family:var(--font);color:var(--text);outline:none">
        <button id="add-part-btn" class="btn btn-secondary btn-sm">+ Dodaj dio</button>
      </div>
    </div>
  </div>

  <script src="js/github.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/pdfParser.js"></script>
  <script>
    if (!Auth.requireAuth()) throw 0;
    document.getElementById("pn").textContent = Auth.getPoslovnica();
    var uz = document.getElementById("upload-zone"), fi = document.getElementById("fi"), fl = document.getElementById("fl"), ft = document.getElementById("ft"), saveBtn = document.getElementById("save-btn");
    var docs = [], dijelovi = [];

    uz.addEventListener("click", function() { fi.click(); });
    document.getElementById("add-more").addEventListener("click", function() { fi.click(); });
    uz.addEventListener("dragover", function(e) { e.preventDefault(); uz.classList.add("dragover"); });
    uz.addEventListener("dragleave", function() { uz.classList.remove("dragover"); });
    uz.addEventListener("drop", function(e) { e.preventDefault(); uz.classList.remove("dragover"); var files = []; var allowed = ["application/pdf","application/vnd.openxmlformats-officedocument.spreadsheetml.sheet","application/vnd.ms-excel","text/csv"]; for (var i=0;i<e.dataTransfer.files.length;i++) { var f=e.dataTransfer.files[i]; if (allowed.indexOf(f.type)>=0 || /\.(pdf|xlsx|xls|csv)$/i.test(f.name)) files.push(f); } proc(files); });
    fi.addEventListener("change", function() { var files = []; for (var i=0;i<fi.files.length;i++) files.push(fi.files[i]); proc(files); fi.value = ""; });

    function proc(files) {
      if (!files.length) return;
      document.getElementById("pl").style.display = "block";
      PDFParser.parseMultiple(files).then(function(results) {
        for (var i = 0; i < results.length; i++) docs.push(results[i]);
        rebuildTags(); fl.style.display = "block"; updateSummary();
      }).catch(function(e) { toast("Greska: " + e.message, "error"); }).then(function() { document.getElementById("pl").style.display = "none"; });
    }

    function rebuildTags() {
      ft.innerHTML = "";
      for (var i = 0; i < docs.length; i++) {
        (function(di) {
          var tag = document.createElement("span"); tag.className = "file-tag";
          tag.innerHTML = '&#128196; ' + docs[di].dokumentNaziv + ' <span class="count">(' + docs[di].stavke.length + ')</span> <button onclick="rmDoc(' + di + ')" style="background:none;border:none;color:var(--danger);cursor:pointer;font-size:14px;margin-left:4px">&#10005;</button>';
          ft.appendChild(tag);
        })(i);
      }
    }

    window.rmDoc = function(di) {
      if (!confirm("Obrisati dokument?")) return;
      docs.splice(di, 1); rebuildTags(); updateSummary();
      if (!docs.length) fl.style.display = "none";
    };

    function updateSummary() {
      var tot = 0, tq = 0;
      for (var i = 0; i < docs.length; i++) { tot += docs[i].stavke.length; for (var j = 0; j < docs[i].stavke.length; j++) tq += docs[i].stavke[j].ocekivano; }
      document.getElementById("ti").textContent = tot;
      document.getElementById("tq").textContent = tq;
      document.getElementById("is").style.display = tot > 0 ? "block" : "none";
      document.getElementById("parts-section").style.display = tot > 0 ? "block" : "none";
      checkSave();
    }

    // ===== PARTS =====
    document.getElementById("add-part-btn").addEventListener("click", function() {
      var name = document.getElementById("new-part").value.trim();
      if (!name) { toast("Unesi naziv dijela", "error"); return; }
      dijelovi.push({ id: "dio-" + Date.now(), naziv: name });
      document.getElementById("new-part").value = "";
      renderParts(); checkSave();
    });

    document.getElementById("new-part").addEventListener("keydown", function(e) {
      if (e.key === "Enter") document.getElementById("add-part-btn").click();
    });

    function renderParts() {
      var pl = document.getElementById("parts-list"); pl.innerHTML = "";
      for (var i = 0; i < dijelovi.length; i++) {
        (function(idx) {
          var el = document.createElement("div"); el.className = "part-item";
          el.innerHTML = '<span style="color:var(--accent);font-weight:700;font-size:13px;width:24px">' + (idx+1) + '</span><span class="part-name">' + dijelovi[idx].naziv + '</span><button onclick="rmPart(' + idx + ')">&#10005;</button>';
          pl.appendChild(el);
        })(i);
      }
    }

    window.rmPart = function(idx) { dijelovi.splice(idx, 1); renderParts(); checkSave(); };

    function checkSave() {
      var tot = 0;
      for (var i = 0; i < docs.length; i++) tot += docs[i].stavke.length;
      saveBtn.disabled = tot === 0 || dijelovi.length === 0;
    }

    // ===== SAVE =====
    saveBtn.addEventListener("click", function() {
      if (!docs.length || !dijelovi.length) return;
      saveBtn.disabled = true; saveBtn.textContent = "Spremam...";
      var pid = Auth.getPoslovnicaId(), now = new Date();
      var id = "inv-" + now.getTime();
      var naziv = document.getElementById("inv-naziv").value.trim();

      // Build stavke for documents
      var dokumenti = [];
      for (var i = 0; i < docs.length; i++) {
        var stavke = [];
        for (var j = 0; j < docs[i].stavke.length; j++) {
          var s = docs[i].stavke[j];
          stavke.push({ naziv: s.naziv, barkod: s.barkod, ocekivano: s.ocekivano, skenirano: 0 });
        }
        dokumenti.push({ naziv: docs[i].dokumentNaziv, stavke: stavke });
      }

      // Main inventura file
      var mainData = {
        id: id, poslovnica: pid, naziv: naziv, datum: now.toISOString().split("T")[0],
        status: "aktivan", kreirano: now.toISOString(), azurirano: now.toISOString(),
        dijelovi: dijelovi, dokumenti: dokumenti
      };

      var folder = "data/inventure/" + pid + "/";
      // Save main file
      GitHubStorage.writeFile(folder + id + ".json", mainData, "Nova inventura").then(function() {
        // Save each part with same articles but 0 scanned
        var chain = Promise.resolve();
        for (var di = 0; di < dijelovi.length; di++) {
          (function(dio) {
            chain = chain.then(function() {
              var partData = {
                id: id + "-dio-" + dio.id, inventuraId: id, dio: dio.naziv,
                dokumenti: JSON.parse(JSON.stringify(dokumenti))
              };
              // Reset all scanned to 0
              for (var d = 0; d < partData.dokumenti.length; d++) {
                for (var s = 0; s < partData.dokumenti[d].stavke.length; s++) partData.dokumenti[d].stavke[s].skenirano = 0;
              }
              return GitHubStorage.writeFile(folder + id + "-dio-" + dio.id + ".json", partData, "Dio: " + dio.naziv);
            });
          })(dijelovi[di]);
        }
        return chain;
      }).then(function() {
        toast("Inventura kreirana!", "success");
        setTimeout(function() { window.location.href = "dashboard.html"; }, 800);
      }).catch(function(e) {
        toast("Greska: " + e.message, "error");
        saveBtn.disabled = false; saveBtn.textContent = "\u{1F4BE} Spremi";
      });
    });

    function toast(m, t) { var old = document.querySelectorAll(".toast"); for(var i=0;i<old.length;i++) old[i].remove(); var el = document.createElement("div"); el.className = "toast " + t; el.textContent = m; document.body.appendChild(el); setTimeout(function() { el.remove(); }, 3000); }
    if(localStorage.getItem("theme")==="dark") document.getElementById("theme-toggle").classList.add("dark");
  </script>
</body>
</html>

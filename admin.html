<!DOCTYPE html>
<html lang="hr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Prijem Robe - Admin</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="icon" href="icons/favicon.png" type="image/png">
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#007aff">
  <style>
    .admin-badge{display:inline-block;font-size:11px;font-weight:700;padding:3px 8px;border-radius:12px;background:#7c3aed;color:#fff;margin-left:8px;vertical-align:middle}
    .posl-section{margin-bottom:24px}
    .posl-header{display:flex;align-items:center;justify-content:space-between;padding:14px 18px;background:var(--bg-white);border:1px solid var(--border);border-radius:var(--radius) var(--radius) 0 0;cursor:pointer;transition:background .15s}
    .posl-header:hover{background:var(--bg-input)}
    .posl-header h3{font-size:17px;font-weight:700}
    .posl-header .posl-stats{font-size:13px;color:var(--text-secondary)}
    .posl-header .arrow{font-size:18px;color:var(--text-muted);transition:transform .2s}
    .posl-header.open .arrow{transform:rotate(90deg)}
    .posl-body{border:1px solid var(--border);border-top:none;border-radius:0 0 var(--radius) var(--radius);overflow:hidden;display:none}
    .posl-body.open{display:block}
    .admin-prijem{display:flex;align-items:center;padding:12px 18px;border-bottom:1px solid var(--border-light);gap:12px;transition:background .15s}
    .admin-prijem:last-child{border-bottom:none}
    .admin-prijem:hover{background:var(--bg)}
    .admin-prijem .prijem-main{flex:1;min-width:0}
    .admin-prijem .prijem-date{font-size:14px;font-weight:600}
    .admin-prijem .prijem-detail{font-size:12px;color:var(--text-secondary);margin-top:2px}
    .admin-prijem .prijem-progress{width:120px;flex-shrink:0}
    .admin-prijem .prog-bar{height:6px;background:var(--bg-input);border-radius:3px;overflow:hidden;margin-top:4px}
    .admin-prijem .prog-fill{height:100%;border-radius:3px;transition:width .3s}
    .admin-prijem .prog-text{font-size:11px;color:var(--text-muted);font-weight:500}
    .admin-prijem .action-btns{display:flex;gap:4px;flex-shrink:0}
    .admin-prijem .action-btns button{width:30px;height:30px;border-radius:8px;border:1px solid var(--border);background:var(--bg-input);color:var(--text-secondary);cursor:pointer;font-size:13px;display:flex;align-items:center;justify-content:center;transition:all .15s}
    .admin-prijem .action-btns button:hover{background:var(--border);color:var(--text)}
    .admin-prijem .action-btns button.del:hover{background:var(--danger-bg);color:var(--danger);border-color:var(--danger-border)}
    .total-stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:24px}
    @media(max-width:500px){
      .total-stats{grid-template-columns:repeat(2,1fr)}
      .admin-prijem{flex-wrap:wrap}
      .admin-prijem .prijem-progress{width:100%}
    }
  </style>
</head>
<body>
  <script>if(localStorage.getItem("theme")==="dark")document.documentElement.setAttribute("data-theme","dark");</script>
  <div class="app">
    <!-- Login -->
    <div id="admin-login" style="display:none">
      <div class="login-wrapper" style="min-height:80vh">
        <div class="login-box">
          <div class="login-logo">
            <img src="icons/logo.svg" alt="PR" style="width:60px;height:60px;border-radius:16px;">
            <h1>Admin Panel</h1>
            <p>Pristup za administratora</p>
          </div>
          <div class="login-card">
            <div class="form-group">
              <label>Admin PIN</label>
              <div class="pin-input-group">
                <input type="password" class="pin-digit" maxlength="1" inputmode="numeric" autocomplete="off">
                <input type="password" class="pin-digit" maxlength="1" inputmode="numeric" autocomplete="off">
                <input type="password" class="pin-digit" maxlength="1" inputmode="numeric" autocomplete="off">
                <input type="password" class="pin-digit" maxlength="1" inputmode="numeric" autocomplete="off">
              </div>
            </div>
            <div id="admin-err" class="error-msg" style="display:none"></div>
            <button id="admin-login-btn" class="btn btn-primary btn-full" disabled>Prijava</button>
          </div>
        </div>
      </div>
    </div>

    <!-- Dashboard -->
    <div id="admin-dashboard" style="display:none">
      <div class="page-header">
        <div class="title-group">
          <h1>&#128230; Admin Panel <span class="admin-badge">ADMIN</span></h1>
          <p>Pregled svih poslovnica</p>
        </div>
        <div class="header-action" style="display:flex;gap:8px;align-items:center">
          <div class="theme-toggle" id="theme-toggle" onclick="var d=document.documentElement.getAttribute('data-theme')==='dark';if(d){document.documentElement.removeAttribute('data-theme');this.classList.remove('dark');localStorage.setItem('theme','light')}else{document.documentElement.setAttribute('data-theme','dark');this.classList.add('dark');localStorage.setItem('theme','dark')}"></div>
          <button onclick="sessionStorage.removeItem('admin_auth');location.reload()" class="btn-icon" title="Odjava">&#9211;</button>
        </div>
      </div>

      <!-- Total stats -->
      <div class="total-stats">
        <div class="stat-card" style="border-left:4px solid #007aff"><div class="value" id="ts-posl">-</div><div class="label">Poslovnica</div></div>
        <div class="stat-card" style="border-left:4px solid #ff9500"><div class="value" id="ts-prijemi">-</div><div class="label">Prijema</div></div>
        <div class="stat-card" style="border-left:4px solid #34c759"><div class="value" id="ts-sken">-</div><div class="label">Skenirano</div></div>
        <div class="stat-card" style="border-left:4px solid #ff3b30"><div class="value" id="ts-ocek">-</div><div class="label">Ocekivano</div></div>
      </div>

      <!-- Tabs -->
      <div style="display:flex;gap:6px;margin-bottom:16px;flex-wrap:wrap">
        <button class="btn btn-primary btn-sm" id="tab-prijemi" onclick="showTab('prijemi')">Prijemi</button>
        <button class="btn btn-secondary btn-sm" id="tab-search" onclick="showTab('search')">&#128269; Pretraga artikala</button>
        <button class="btn btn-secondary btn-sm" id="tab-posl" onclick="showTab('posl')">&#9881; Poslovnice</button>
      </div>

      <!-- Tab: Prijemi -->
      <div id="panel-prijemi">
        <div id="posl-list">
          <div class="empty-state loading"><div class="empty-icon">&#9203;</div><h3>Ucitavanje...</h3></div>
        </div>
      </div>

      <!-- Tab: Search -->
      <div id="panel-search" style="display:none">
        <div style="margin-bottom:16px">
          <div class="scan-input-row">
            <input type="text" id="search-input" placeholder="Upisi barkod ili naziv artikla..." style="flex:1;padding:14px 16px;background:var(--bg-white);border:1.5px solid var(--border);border-radius:12px;font-size:16px;font-family:var(--font);color:var(--text);outline:none" oninput="doSearch(this.value)">
          </div>
        </div>
        <div id="search-results"></div>
      </div>

      <!-- Tab: Poslovnice -->
      <div id="panel-posl" style="display:none">
        <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:16px">
          <h3 style="font-size:18px;font-weight:700">Upravljanje poslovnicama</h3>
          <button class="btn btn-primary btn-sm" onclick="showAddPosl()">+ Nova poslovnica</button>
        </div>
        <div id="add-posl-form" style="display:none;background:var(--bg-white);border:1px solid var(--border);border-radius:12px;padding:16px;margin-bottom:16px">
          <div style="font-size:14px;font-weight:600;margin-bottom:10px">Nova poslovnica</div>
          <div style="display:flex;gap:8px;flex-wrap:wrap">
            <input type="text" id="new-posl-naziv" placeholder="Naziv (npr. BB Nova)" style="flex:2;min-width:150px;padding:10px 12px;background:var(--bg-input);border:1.5px solid var(--border);border-radius:8px;font-size:14px;font-family:var(--font);color:var(--text);outline:none">
            <input type="text" id="new-posl-pin" placeholder="PIN (4 broja)" maxlength="4" inputmode="numeric" style="width:80px;padding:10px 12px;background:var(--bg-input);border:1.5px solid var(--border);border-radius:8px;font-size:14px;font-family:var(--font);color:var(--text);outline:none;text-align:center">
            <button class="btn btn-success btn-sm" onclick="addPoslovnica()">Dodaj</button>
            <button class="btn btn-secondary btn-sm" onclick="document.getElementById('add-posl-form').style.display='none'">Odustani</button>
          </div>
        </div>
        <div id="posl-manage-list"></div>
      </div>
    <div style="text-align:center;padding:20px 16px 12px;font-size:11px;color:var(--text-muted);border-top:1px solid var(--border-light);margin-top:30px">Prijem Robe &middot; Razvijeno za Big Bang Hrvatska<br>Podrska: <a href="mailto:tomislav.vlahovic@bigbang.hr" style="color:var(--accent);text-decoration:none">tomislav.vlahovic@bigbang.hr</a> &middot; +385 91 576 3877</div>
</div>

  <script src="js/github.js"></script>
  <script>
    var ADMIN_PIN = "1409";
    var poslovnice = [];
    var allData = {};

    // ===== CHECK TOKEN =====
    if (!GitHubStorage.isConfigured()) {
      alert("GitHub token nije postavljen. Postavi ga na glavnoj stranici.");
      window.location.href = "index.html";
    }

    // ===== AUTH =====
    var isAdmin = sessionStorage.getItem("admin_auth") === "true";

    if (isAdmin) {
      document.getElementById("admin-login").style.display = "none";
      document.getElementById("admin-dashboard").style.display = "block";
      loadAll();
    } else {
      document.getElementById("admin-login").style.display = "block";
    }

    // PIN input
    var pins = document.querySelectorAll(".pin-digit");
    var loginBtn = document.getElementById("admin-login-btn");

    for (var idx = 0; idx < pins.length; idx++) {
      (function(i) {
        pins[i].addEventListener("input", function() { if (pins[i].value && i < 3) pins[i+1].focus(); pins[i].classList.toggle("filled", !!pins[i].value); chk(); });
        pins[i].addEventListener("keydown", function(e) { if (e.key === "Backspace" && !pins[i].value && i > 0) { pins[i-1].focus(); pins[i-1].value = ""; pins[i-1].classList.remove("filled"); } });
      })(idx);
    }

    function getPin() { var p = ""; for (var i = 0; i < pins.length; i++) p += pins[i].value; return p; }
    function chk() { loginBtn.disabled = getPin().length !== 4; }

    loginBtn.addEventListener("click", doLogin);
    if (pins[3]) pins[3].addEventListener("keydown", function(e) { if (e.key === "Enter" && !loginBtn.disabled) doLogin(); });

    function doLogin() {
      if (getPin() === ADMIN_PIN) {
        sessionStorage.setItem("admin_auth", "true");
        document.getElementById("admin-login").style.display = "none";
        document.getElementById("admin-dashboard").style.display = "block";
        loadAll();
      } else {
        document.getElementById("admin-err").textContent = "Pogresan PIN";
        document.getElementById("admin-err").style.display = "block";
        for (var i = 0; i < pins.length; i++) { pins[i].value = ""; pins[i].classList.remove("filled"); }
        pins[0].focus();
      }
    }

    // ===== LOAD ALL DATA =====
    function loadAll() {
      GitHubStorage.readFile("data/poslovnice.json").then(function(data) {
        if (!data) return;
        poslovnice = data.content.poslovnice;
        document.getElementById("ts-posl").textContent = poslovnice.length;

        var chain = Promise.resolve();
        var totalPrijemi = 0, totalSken = 0, totalOcek = 0;

        for (var i = 0; i < poslovnice.length; i++) {
          (function(posl) {
            chain = chain.then(function() {
              return loadPoslovnica(posl.id).then(function(prijemi) {
                allData[posl.id] = prijemi;
                totalPrijemi += prijemi.length;
                for (var j = 0; j < prijemi.length; j++) {
                  for (var d = 0; d < prijemi[j].dokumenti.length; d++) {
                    for (var s = 0; s < prijemi[j].dokumenti[d].stavke.length; s++) {
                      totalSken += (prijemi[j].dokumenti[d].stavke[s].skenirano || 0);
                      totalOcek += prijemi[j].dokumenti[d].stavke[s].ocekivano;
                    }
                  }
                }
              });
            });
          })(poslovnice[i]);
        }

        chain.then(function() {
          document.getElementById("ts-prijemi").textContent = totalPrijemi;
          document.getElementById("ts-sken").textContent = totalSken;
          document.getElementById("ts-ocek").textContent = totalOcek;
          renderPoslovnice();
        });
      });
    }

    function loadPoslovnica(pid) {
      return GitHubStorage.listFiles("data/prijemi/" + pid).then(function(files) {
        var prijemi = [];
        var chain = Promise.resolve();
        var validFiles = [];
        for (var i = 0; i < (files || []).length; i++) {
          if (files[i].name.indexOf(".json") > -1 && files[i].name.indexOf(".") !== 0) validFiles.push(files[i]);
        }
        for (var i = 0; i < validFiles.length; i++) {
          (function(f) {
            chain = chain.then(function() {
              return GitHubStorage.readFile(f.path).then(function(d) {
                if (d) { d.content._sha = d.sha; d.content._path = f.path; prijemi.push(d.content); }
              }).catch(function() {});
            });
          })(validFiles[i]);
        }
        return chain.then(function() {
          prijemi.sort(function(a, b) { return new Date(b.datum) - new Date(a.datum); });
          return prijemi;
        });
      }).catch(function() { return []; });
    }

    // ===== RENDER =====
    function renderPoslovnice() {
      var container = document.getElementById("posl-list");
      container.innerHTML = "";

      for (var i = 0; i < poslovnice.length; i++) {
        var posl = poslovnice[i];
        var prijemi = allData[posl.id] || [];

        var totSken = 0, totOcek = 0, totArt = 0, activeCount = 0, doneCount = 0;
        for (var j = 0; j < prijemi.length; j++) {
          if (prijemi[j].status === "zavrsen") doneCount++; else activeCount++;
          for (var d = 0; d < prijemi[j].dokumenti.length; d++) {
            totArt += prijemi[j].dokumenti[d].stavke.length;
            for (var s = 0; s < prijemi[j].dokumenti[d].stavke.length; s++) {
              totSken += (prijemi[j].dokumenti[d].stavke[s].skenirano || 0);
              totOcek += prijemi[j].dokumenti[d].stavke[s].ocekivano;
            }
          }
        }

        var section = document.createElement("div");
        section.className = "posl-section";

        var header = document.createElement("div");
        header.className = "posl-header";
        var borderColors = ["#007aff","#34c759","#ff9500","#ff3b30","#af52de","#5ac8fa","#ff2d55","#ffcc00","#30b0c7","#8e8e93"];
        header.style.borderLeft = "4px solid " + borderColors[i % borderColors.length];
        header.innerHTML = '<div><h3>' + posl.naziv + '</h3><div class="posl-stats">' + prijemi.length + ' prijema &middot; ' + activeCount + ' aktivnih &middot; ' + doneCount + ' zavrsenih &middot; ' + totSken + '/' + totOcek + ' sken.</div></div><span class="arrow">&#9654;</span>';

        var body = document.createElement("div");
        body.className = "posl-body";

        if (prijemi.length === 0) {
          body.innerHTML = '<div style="padding:20px;text-align:center;color:var(--text-muted);font-size:13px">Nema prijema</div>';
        } else {
          for (var j = 0; j < prijemi.length; j++) {
            (function(p, pid) {
              var pSken = 0, pOcek = 0, pArt = 0;
              for (var d = 0; d < p.dokumenti.length; d++) {
                pArt += p.dokumenti[d].stavke.length;
                for (var s = 0; s < p.dokumenti[d].stavke.length; s++) {
                  pSken += (p.dokumenti[d].stavke[s].skenirano || 0);
                  pOcek += p.dokumenti[d].stavke[s].ocekivano;
                }
              }
              var pct = pOcek > 0 ? Math.round((pSken / pOcek) * 100) : 0;
              var date = new Date(p.datum).toLocaleDateString("hr-HR", { day: "numeric", month: "short", year: "numeric" });
              var statusText = p.status === "zavrsen" ? "Zavrsen" : p.status === "aktivan" ? "Aktivan" : "Priprema";
              var statusClass = p.status;
              var barColor = pct >= 100 ? "#34c759" : pct > 0 ? "#ff9500" : "#e5e5ea";

              var row = document.createElement("div");
              row.className = "admin-prijem";
              var detailId = "detail-" + pid + "-" + p.id;
              var toggleIcon = p.status === "zavrsen" ? "&#9654;" : "&#10003;";
              var toggleTitle = p.status === "zavrsen" ? "Prebaci u Aktivan" : "Prebaci u Zavrsen";
              var displayName = p.naziv ? p.naziv : date;
              var subInfo = p.naziv ? date + ' &middot; ' : '';
              row.innerHTML = '<div class="prijem-main" style="cursor:pointer" onclick="toggleDetail(\'' + detailId + '\')"><div class="prijem-date">' + displayName + ' <span class="status-badge ' + statusClass + '">' + statusText + '</span></div><div class="prijem-detail">' + subInfo + p.dokumenti.length + ' dok. &middot; ' + pArt + ' artikala &middot; ' + pSken + '/' + pOcek + ' sken.</div></div><div class="prijem-progress"><div class="prog-text">' + pct + '%</div><div class="prog-bar"><div class="prog-fill" style="width:' + pct + '%;background:' + barColor + '"></div></div></div><div class="action-btns"><button title="Eksport Excel" onclick="exportPrijem(\'' + pid + '\',\'' + p.id + '\')">&#128202;</button><button title="Preimenuj" onclick="renamePrijem(\'' + pid + '\',\'' + p.id + '\')">&#9998;</button><button title="' + toggleTitle + '" onclick="toggleStatus(\'' + pid + '\',\'' + p.id + '\')">' + toggleIcon + '</button><button class="del" title="Obrisi" onclick="deletePrijem(\'' + pid + '\',\'' + p._path + '\',\'' + p._sha + '\')">&#10005;</button></div>';
              body.appendChild(row);

              // Inline detail panel with editable qty
              var detail = document.createElement("div");
              detail.id = detailId;
              detail.style.display = "none";
              detail.style.borderBottom = "1px solid var(--border-light)";
              detail.style.background = "var(--bg)";

              var detailHtml = "";
              // Top bar with PDF upload and save
              detailHtml += '<div style="display:flex;align-items:center;justify-content:space-between;padding:10px 18px;border-bottom:1px solid var(--border-light)">';
              detailHtml += '<div style="display:flex;gap:8px;align-items:center">';
              detailHtml += '<button onclick="document.getElementById(\'file-' + detailId + '\').click()" style="display:inline-flex;align-items:center;gap:4px;padding:5px 10px;border:1px solid var(--border);border-radius:6px;background:var(--bg-white);cursor:pointer;font-size:12px;font-family:var(--font);color:var(--text-secondary)">&#128196; + Dodaj dokument</button>';
              detailHtml += '<input type="file" id="file-' + detailId + '" accept=".pdf,.xlsx,.xls,.csv" multiple style="display:none" onchange="addPdfToEdit(\'' + pid + '\',\'' + p.id + '\',this)">';
              detailHtml += '</div>';
              detailHtml += '<button onclick="saveEdit(\'' + pid + '\',\'' + p.id + '\')" style="display:inline-flex;align-items:center;gap:4px;padding:5px 12px;border:none;border-radius:6px;background:var(--success);color:#fff;cursor:pointer;font-size:12px;font-weight:600;font-family:var(--font)">&#128190; Spremi</button>';
              detailHtml += '</div>';

              for (var dd = 0; dd < p.dokumenti.length; dd++) {
                // Calculate document-level stats
                var docSken = 0, docOcek = 0;
                for (var ss2 = 0; ss2 < p.dokumenti[dd].stavke.length; ss2++) {
                  docSken += (p.dokumenti[dd].stavke[ss2].skenirano || 0);
                  docOcek += p.dokumenti[dd].stavke[ss2].ocekivano;
                }
                var docStatus = docSken === 0 ? "none" : docSken < docOcek ? "partial" : docSken >= docOcek ? "ok" : "over";
                var docStatusColor = docStatus === "ok" ? "var(--success)" : docStatus === "partial" ? "var(--warning)" : "var(--danger)";
                var docStatusIcon = docStatus === "ok" ? "\u2713" : docStatus === "partial" ? "\u25D0" : "\u25CB";
                detailHtml += '<div style="display:flex;align-items:center;padding:8px 18px 4px;font-size:12px;font-weight:600;color:var(--text-secondary);gap:8px">';
                detailHtml += '<span style="color:' + docStatusColor + '">' + docStatusIcon + '</span>';
                detailHtml += '<span style="flex:1">&#128196; ' + p.dokumenti[dd].naziv + ' <span style="font-weight:400">(' + docSken + '/' + docOcek + ')</span></span>';
                detailHtml += '<button onclick="deleteDoc(\'' + pid + '\',\'' + p.id + '\',' + dd + ')" style="background:none;border:none;color:var(--danger);cursor:pointer;font-size:13px" title="Obrisi dokument">&#10005;</button>';
                detailHtml += '</div>';
                for (var ss = 0; ss < p.dokumenti[dd].stavke.length; ss++) {
                  var st = p.dokumenti[dd].stavke[ss];
                  var sken = st.skenirano || 0;
                  var diff = sken - st.ocekivano;
                  var stStatus = sken === 0 ? "none" : sken < st.ocekivano ? "partial" : sken === st.ocekivano ? "ok" : "over";
                  var stIcon = stStatus === "ok" ? "\u2713" : stStatus === "partial" ? "\u25D0" : stStatus === "over" ? "!" : "\u25CB";
                  var diffText = diff === 0 ? "" : (diff > 0 ? "+" + diff : "" + diff);
                  var diffColor = diff === 0 ? "var(--success)" : diff > 0 ? "var(--warning)" : "var(--danger)";
                  var inputId = "eq-" + pid + "-" + p.id + "-" + dd + "-" + ss;
                  detailHtml += '<div style="display:flex;align-items:center;padding:6px 18px 6px 28px;gap:10px;border-top:1px solid var(--border-light);font-size:13px">';
                  detailHtml += '<div class="article-icon status-' + stStatus + '" style="width:28px;height:28px;font-size:13px;flex-shrink:0">' + stIcon + '</div>';
                  detailHtml += '<div style="flex:1;min-width:0"><div style="font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">' + st.naziv + '</div><div style="font-size:11px;color:var(--text-muted)">' + st.barkod + '</div></div>';
                  detailHtml += '<div style="display:flex;align-items:center;gap:3px;flex-shrink:0"><input type="text" inputmode="numeric" id="' + inputId + '" value="' + sken + '" style="width:38px;padding:3px 1px;text-align:center;font-size:13px;font-weight:700;border:1.5px solid var(--border);border-radius:6px;background:var(--bg-input);color:var(--text);outline:none;font-family:var(--font)" onfocus="this.select()"><span style="color:var(--text-muted);font-size:11px">/' + st.ocekivano + '</span></div>';

                  detailHtml += '</div>';
                }
              }
              detail.innerHTML = detailHtml;
              body.appendChild(detail);
            })(prijemi[j], posl.id);
          }
        }

        (function(h, b) {

          });
        })(header, body);

        section.appendChild(header);
        section.appendChild(body);
        container.appendChild(section);
      }

    window.createPrijemFromFiles = function(pid, fileInput) {
      if (!fileInput.files.length) return;
      var files = [];
      for (var i = 0; i < fileInput.files.length; i++) files.push(fileInput.files[i]);

      if (typeof PDFParser === "undefined") {
        var s = document.createElement("script");
        s.src = "js/pdfParser.js";
        s.onload = function() { doCreatePrijem(pid, files); };
        document.head.appendChild(s);
      } else {
        doCreatePrijem(pid, files);
      }
      fileInput.value = "";

    function doCreatePrijem(pid, files) {
      PDFParser.parseMultiple(files).then(function(results) {
        var now = new Date();
        var id = "prijem-" + now.getTime();
        var dokumenti = [];
        for (var r = 0; r < results.length; r++) {
          dokumenti.push({ naziv: results[r].dokumentNaziv, stavke: results[r].stavke });
        }
        var nazivInput = document.getElementById("naziv-new-prijem-" + pid);
        var naziv = nazivInput ? nazivInput.value.trim() : "";
        var data = {
          id: id, poslovnica: pid, naziv: naziv, datum: now.toISOString().split("T")[0],
          status: "aktivan", kreirano: now.toISOString(), azurirano: now.toISOString(),
          dokumenti: dokumenti
        };
        GitHubStorage.writeFile("data/prijemi/" + pid + "/" + id + ".json", data, "Admin novi prijem").then(function() {
          toast("Prijem kreiran!", "success");
          var panel = document.getElementById("new-prijem-" + pid);
          if (panel) panel.remove();
          loadAll();
        }).catch(function(e) { toast("Greska: " + e.message, "error"); });
      }).catch(function(e) { toast("Greska: " + e.message, "error"); });
    }

    function escXml(s) { return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;"); }

    window.exportPrijem = function(pid, prijemId) {
      var prijemi = allData[pid] || [];
      var p = null;
      for (var i = 0; i < prijemi.length; i++) { if (prijemi[i].id === prijemId) { p = prijemi[i]; break; } }
      if (!p) return;

      // Build items list
      var items = [];
      for (var d = 0; d < p.dokumenti.length; d++) {
        for (var s = 0; s < p.dokumenti[d].stavke.length; s++) {
          var st = p.dokumenti[d].stavke[s];
          items.push({ dn: p.dokumenti[d].naziv, naziv: st.naziv, barkod: st.barkod, ocekivano: st.ocekivano, skenirano: st.skenirano || 0 });
        }
      }

      var xml = '<?xml version="1.0" encoding="UTF-8"?>\n';
      xml += '<?mso-application progid="Excel.Sheet"?>\n';
      xml += '<Workbook xmlns="urn:schemas-microsoft-com:office:spreadsheet" xmlns:ss="urn:schemas-microsoft-com:office:spreadsheet">\n';
      xml += '<Styles>\n';
      xml += '<Style ss:ID="header"><Interior ss:Color="#DBEAFE" ss:Pattern="Solid"/><Font ss:Bold="1" ss:Color="#1E3A5F"/><Alignment ss:Horizontal="Center"/><Borders><Border ss:Position="Bottom" ss:LineStyle="Continuous" ss:Weight="2"/></Borders></Style>\n';
      xml += '<Style ss:ID="def"></Style>\n';
      xml += '<Style ss:ID="defSep"><Borders><Border ss:Position="Bottom" ss:LineStyle="Continuous" ss:Weight="2"/></Borders></Style>\n';
      xml += '<Style ss:ID="ok"><Interior ss:Color="#D1FAE5" ss:Pattern="Solid"/><Font ss:Bold="1" ss:Color="#166534"/></Style>\n';
      xml += '<Style ss:ID="okSep"><Interior ss:Color="#D1FAE5" ss:Pattern="Solid"/><Font ss:Bold="1" ss:Color="#166534"/><Borders><Border ss:Position="Bottom" ss:LineStyle="Continuous" ss:Weight="2"/></Borders></Style>\n';
      xml += '<Style ss:ID="minus"><Interior ss:Color="#FEE2E2" ss:Pattern="Solid"/><Font ss:Bold="1" ss:Color="#DC2626"/></Style>\n';
      xml += '<Style ss:ID="minusSep"><Interior ss:Color="#FEE2E2" ss:Pattern="Solid"/><Font ss:Bold="1" ss:Color="#DC2626"/><Borders><Border ss:Position="Bottom" ss:LineStyle="Continuous" ss:Weight="2"/></Borders></Style>\n';
      xml += '<Style ss:ID="plus"><Interior ss:Color="#FEF3C7" ss:Pattern="Solid"/><Font ss:Bold="1" ss:Color="#D97706"/></Style>\n';
      xml += '<Style ss:ID="plusSep"><Interior ss:Color="#FEF3C7" ss:Pattern="Solid"/><Font ss:Bold="1" ss:Color="#D97706"/><Borders><Border ss:Position="Bottom" ss:LineStyle="Continuous" ss:Weight="2"/></Borders></Style>\n';
      xml += '</Styles>\n';
      xml += '<Worksheet ss:Name="Prijem">\n<Table>\n';
      xml += '<Column ss:Width="140"/><Column ss:Width="300"/><Column ss:Width="110"/><Column ss:Width="80"/><Column ss:Width="80"/><Column ss:Width="70"/>\n';
      xml += '<Row>';
      var headers = ["Dokument","Naziv","Barkod","Ocekivano","Skenirano","Razlika"];
      for (var h = 0; h < headers.length; h++) xml += '<Cell ss:StyleID="header"><Data ss:Type="String">' + headers[h] + '</Data></Cell>';
      xml += '</Row>\n';
      for (var i = 0; i < items.length; i++) {
        var it = items[i];
        var diff = it.skenirano - it.ocekivano;
        var isLastInDoc = (i === items.length - 1) || (items[i + 1].dn !== it.dn);
        var rowStyle = isLastInDoc ? "defSep" : "def";
        var diffStyle;
        if (diff === 0 && it.skenirano > 0) diffStyle = isLastInDoc ? "okSep" : "ok";
        else if (diff < 0) diffStyle = isLastInDoc ? "minusSep" : "minus";
        else if (diff > 0) diffStyle = isLastInDoc ? "plusSep" : "plus";
        else diffStyle = rowStyle;
        xml += '<Row>';
        xml += '<Cell ss:StyleID="' + rowStyle + '"><Data ss:Type="String">' + escXml(it.dn) + '</Data></Cell>';
        xml += '<Cell ss:StyleID="' + rowStyle + '"><Data ss:Type="String">' + escXml(it.naziv) + '</Data></Cell>';
        xml += '<Cell ss:StyleID="' + rowStyle + '"><Data ss:Type="String">' + it.barkod + '</Data></Cell>';
        xml += '<Cell ss:StyleID="' + rowStyle + '"><Data ss:Type="Number">' + it.ocekivano + '</Data></Cell>';
        xml += '<Cell ss:StyleID="' + rowStyle + '"><Data ss:Type="Number">' + it.skenirano + '</Data></Cell>';
        xml += '<Cell ss:StyleID="' + diffStyle + '"><Data ss:Type="Number">' + diff + '</Data></Cell>';
        xml += '</Row>\n';
      }
      xml += '</Table>\n</Worksheet>\n</Workbook>';

      var poslNaziv = "";
      for (var pi = 0; pi < poslovnice.length; pi++) { if (poslovnice[pi].id === pid) { poslNaziv = poslovnice[pi].naziv; break; } }
      var fileName = "prijem-" + (p.naziv || p.datum) + "-" + poslNaziv + ".xls";
      fileName = fileName.replace(/[^a-zA-Z0-9\-_.]/g, "_");
      var a = document.createElement("a");
      a.href = URL.createObjectURL(new Blob([xml], { type: "application/vnd.ms-excel;charset=utf-8" }));
      a.download = fileName; a.click();
      toast("Exportirano!", "success");
    };

    // ===== SEARCH =====
    var searchTimer = null;
    window.doSearch = function(query) {
      clearTimeout(searchTimer);
      searchTimer = setTimeout(function() { executeSearch(query); }, 300);
    };

    function executeSearch(query) {
      var container = document.getElementById("search-results");
      query = query.trim().toLowerCase();
      if (query.length < 2) { container.innerHTML = '<div style="text-align:center;color:var(--text-muted);padding:30px;font-size:14px">Upisi najmanje 2 znaka za pretragu</div>'; return; }

      var results = [];
      for (var pid in allData) {
        var prijemi = allData[pid];
        var poslNaziv = "";
        for (var pi = 0; pi < poslovnice.length; pi++) { if (poslovnice[pi].id === pid) { poslNaziv = poslovnice[pi].naziv; break; } }

        for (var j = 0; j < prijemi.length; j++) {
          var p = prijemi[j];
          for (var d = 0; d < p.dokumenti.length; d++) {
            for (var s = 0; s < p.dokumenti[d].stavke.length; s++) {
              var st = p.dokumenti[d].stavke[s];
              if (st.barkod.toLowerCase().indexOf(query) >= 0 || st.naziv.toLowerCase().indexOf(query) >= 0) {
                results.push({
                  poslovnica: poslNaziv,
                  datum: p.datum,
                  status: p.status,
                  dokument: p.dokumenti[d].naziv,
                  naziv: st.naziv,
                  barkod: st.barkod,
                  ocekivano: st.ocekivano,
                  skenirano: st.skenirano || 0
                });
              }
            }
          }
        }
      }

      if (results.length === 0) {
        container.innerHTML = '<div style="text-align:center;color:var(--text-muted);padding:30px;font-size:14px">Nema rezultata za "' + query + '"</div>';
        return;
      }

      var html = '<div style="font-size:13px;color:var(--text-secondary);margin-bottom:8px">' + results.length + ' rezultata</div>';
      html += '<div class="article-list-section">';
      for (var i = 0; i < results.length; i++) {
        var r = results[i];
        var sken = r.skenirano;
        var stStatus = sken === 0 ? "none" : sken < r.ocekivano ? "partial" : sken === r.ocekivano ? "ok" : "over";
        var stIcon = stStatus === "ok" ? "\u2713" : stStatus === "partial" ? "\u25D0" : stStatus === "over" ? "!" : "\u25CB";
        var statusBadge = r.status === "zavrsen" ? "zavrsen" : "aktivan";
        var date = new Date(r.datum).toLocaleDateString("hr-HR", { day: "numeric", month: "short" });
        html += '<div class="article-item" style="flex-wrap:wrap">';
        html += '<div class="article-icon status-' + stStatus + '" style="width:28px;height:28px;font-size:13px">' + stIcon + '</div>';
        html += '<div style="flex:1;min-width:0"><div style="font-weight:500;font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">' + r.naziv + '</div><div style="font-size:11px;color:var(--text-muted)">' + r.barkod + '</div></div>';
        html += '<div style="font-weight:700;font-size:14px;flex-shrink:0">' + sken + '<span style="color:var(--text-muted);font-weight:400;font-size:12px">/' + r.ocekivano + '</span></div>';
        html += '<div style="width:100%;display:flex;gap:6px;margin-top:4px;padding-left:38px;font-size:11px;color:var(--text-secondary)">';
        html += '<span style="background:var(--bg-input);padding:2px 6px;border-radius:4px">' + r.poslovnica + '</span>';
        html += '<span style="background:var(--bg-input);padding:2px 6px;border-radius:4px">' + date + '</span>';
        html += '<span style="background:var(--bg-input);padding:2px 6px;border-radius:4px">' + r.dokument + '</span>';
        html += '<span class="status-badge ' + statusBadge + '" style="font-size:10px;padding:2px 6px">' + (r.status === "zavrsen" ? "Zavrsen" : "Aktivan") + '</span>';
        html += '</div></div>';
      }
      html += '</div>';
      container.innerHTML = html;
    }

    function renderPoslManage() {

          html += '<div style="flex:1"><div style="font-weight:600;font-size:15px">' + p.naziv + '</div><div style="font-size:12px;color:var(--text-muted)">ID: ' + p.id + ' &middot; PIN: ' + p.pin + ' &middot; ' + prijemCount + ' prijema</div></div>';
          html += '<button onclick="editPosl(' + idx + ')" style="padding:6px 10px;border:1px solid var(--border);border-radius:6px;background:var(--bg-input);cursor:pointer;font-size:12px;font-family:var(--font);color:var(--text-secondary)" title="Uredi">&#9998;</button>';
          html += '<button onclick="deletePosl(' + idx + ')" style="padding:6px 10px;border:1px solid var(--danger-border);border-radius:6px;background:var(--danger-bg);cursor:pointer;font-size:12px;font-family:var(--font);color:var(--danger)" title="Obrisi">&#10005;</button>';
          html += '</div>';
        })(poslovnice[i], i);
      }
      container.innerHTML = html;
    }

    window.addPoslovnica = function() {
      var naziv = document.getElementById("new-posl-naziv").value.trim();
      var pin = document.getElementById("new-posl-pin").value.trim();
      if (!naziv) { toast("Unesi naziv", "error"); return; }
      if (!/^\d{4}$/.test(pin)) { toast("PIN mora biti 4 broja", "error"); return; }
      // Check duplicate PIN
      for (var i = 0; i < poslovnice.length; i++) { if (poslovnice[i].pin === pin) { toast("PIN vec postoji", "error"); return; } }
      // Generate ID from naziv
      var id = naziv.toLowerCase().replace(/\s+/g, "-").replace(/[^a-z0-9\-]/g, "");
      // Check duplicate ID
      for (var i = 0; i < poslovnice.length; i++) { if (poslovnice[i].id === id) { toast("Poslovnica s tim imenom vec postoji", "error"); return; } }

      poslovnice.push({ id: id, naziv: naziv, pin: pin });
      savePoslovnice().then(function() {
        toast("Poslovnica dodana!", "success");
        document.getElementById("new-posl-naziv").value = "";
        document.getElementById("new-posl-pin").value = "";
        document.getElementById("add-posl-form").style.display = "none";
        renderPoslManage();
        document.getElementById("ts-posl").textContent = poslovnice.length;
      });
    };

    window.editPosl = function(idx) {
      var p = poslovnice[idx];
      var newNaziv = prompt("Naziv poslovnice:", p.naziv);
      if (newNaziv === null) return;
      newNaziv = newNaziv.trim();
      if (!newNaziv) { toast("Naziv ne moze biti prazan", "error"); return; }

      var newPin = prompt("PIN (4 broja):", p.pin);
      if (newPin === null) return;
      newPin = newPin.trim();
      if (!/^\d{4}$/.test(newPin)) { toast("PIN mora biti 4 broja", "error"); return; }
      // Check duplicate PIN
      for (var i = 0; i < poslovnice.length; i++) { if (i !== idx && poslovnice[i].pin === newPin) { toast("PIN vec postoji", "error"); return; } }

      poslovnice[idx].naziv = newNaziv;
      poslovnice[idx].pin = newPin;
      savePoslovnice().then(function() {
        toast("Poslovnica azurirana!", "success");
        renderPoslManage();
      });
    };

    window.deletePosl = function(idx) {
      var p = poslovnice[idx];
      var prijemCount = (allData[p.id] || []).length;
      if (prijemCount > 0) {
        if (!confirm("Poslovnica " + p.naziv + " ima " + prijemCount + " prijema!\n\nBrisanjem poslovnice NE brisu se njeni prijemi.\n\nNastaviti?")) return;
      } else {
        if (!confirm("Obrisati poslovnicu " + p.naziv + "?")) return;
      }
      poslovnice.splice(idx, 1);
      savePoslovnice().then(function() {
        toast("Poslovnica obrisana!", "success");
        renderPoslManage();
        document.getElementById("ts-posl").textContent = poslovnice.length;
      });
    };

    function savePoslovnice() {
      return GitHubStorage.readFile("data/poslovnice.json").then(function(data) {
        var sha = data ? data.sha : null;
        return GitHubStorage.writeFile("data/poslovnice.json", { poslovnice: poslovnice }, "Admin poslovnice", sha);
      });
    }

    function toast(m, t) { var old = document.querySelectorAll(".toast"); for (var i = 0; i < old.length; i++) old[i].remove(); var el = document.createElement("div"); el.className = "toast " + t; el.textContent = m; document.body.appendChild(el); setTimeout(function() { el.remove(); }, 3000); }
    if (localStorage.getItem("theme") === "dark") document.getElementById("theme-toggle").classList.add("dark");
  </script>
</body>
</html>

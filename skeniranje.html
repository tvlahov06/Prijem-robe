<!DOCTYPE html>
<html lang="hr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Prijem Robe - Skeniranje</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="icon" href="icons/favicon.png" type="image/png">
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#007aff">
  <style>
    @media(max-width:500px){
      .page-header{flex-wrap:wrap;gap:8px}
      .page-header .title-group h1{font-size:16px}
      .page-header .header-action{width:100%;display:flex;gap:6px}
      .page-header .header-action .btn{flex:1}
      .stat-card{padding:10px 6px}.stat-card .value{font-size:20px}
      .article-item{padding:10px 12px;gap:8px}
      .article-info .name{font-size:12px}
      .article-info .barcode{font-size:11px}
      .qi{width:40px;font-size:14px;padding:4px 1px}
      .scan-input-row input{font-size:16px;padding:12px}
      .bottom-actions{position:sticky;bottom:0;background:var(--bg);padding:12px 0}
    }
    .online-badge{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:600;padding:4px 10px;border-radius:20px;margin-left:8px}
    .online-badge.online{background:var(--success-bg);color:var(--success)}
    .online-badge.offline{background:var(--danger-bg);color:var(--danger)}
    .online-badge .dot{width:7px;height:7px;border-radius:50%}
    .online-badge.online .dot{background:var(--success)}
    .online-badge.offline .dot{background:var(--danger);animation:pulse 1.5s infinite}
    .pending-badge{font-size:11px;color:var(--warning);margin-left:6px;font-weight:500}
  </style>
</head>
<body>
  <script>if(localStorage.getItem("theme")==="dark")document.documentElement.setAttribute("data-theme","dark");</script>
  <div class="app">
    <div class="page-header">
      <button class="back-btn" onclick="window.location.href='dashboard.html'">&#8592;</button>
      <div class="title-group">
        <h1 id="dt">Ucitavanje...<span id="net-badge" class="online-badge online"><span class="dot"></span>Online</span></h1>
        <p id="dd"></p>
      </div>
      <div class="header-action" style="display:flex;gap:6px;align-items:center">
        <div class="theme-toggle" id="theme-toggle" onclick="var d=document.documentElement.getAttribute('data-theme')==='dark';if(d){document.documentElement.removeAttribute('data-theme');this.classList.remove('dark');localStorage.setItem('theme','light')}else{document.documentElement.setAttribute('data-theme','dark');this.classList.add('dark');localStorage.setItem('theme','dark')}if(typeof render==='function'){setTimeout(render,50);}"></div>
        <button id="edit-btn" class="btn btn-secondary btn-sm">&#9998; Uredi</button>
        <button id="fin-btn" class="btn btn-success btn-sm">&#10003; Zavrsi</button>
      </div>
    </div>

    <div id="fin-banner" class="finished-banner" style="display:none">
      <span class="text">&#10003; Prijem zavrsen</span>
      <button id="reopen-btn" class="btn btn-secondary btn-sm">Nastavi prijem</button>
    </div>

    <div class="stats-row">
      <div class="stat-card" style="border-left:4px solid #007aff"><div class="value" id="ss">0</div><div class="label">Skenirano</div></div>
      <div class="stat-card" style="border-left:4px solid #ff9500"><div class="value" id="se">0</div><div class="label">Ocekivano</div></div>
      <div class="stat-card" id="sdc" style="border-left:4px solid #ff3b30"><div class="value" id="sd">0</div><div class="label">Razlika</div></div>
    </div>

    <div id="sb" class="scan-banner"></div>

    <div class="scan-section">
      <div style="margin-bottom:8px;font-size:13px;color:var(--text-secondary);font-weight:500">Barkod unos:<span id="pending-info" class="pending-badge"></span></div>
      <div class="scan-input-row">
        <input type="text" id="si" placeholder="Skeniraj ili upisi barkod..." autocomplete="off" autofocus>
      </div>
    </div>

    <div class="article-list-section">
      <div class="article-list-header">Artikli</div>
      <div id="il"></div>
    </div>

    <div class="bottom-actions">
      <button id="exp-btn" class="btn btn-secondary btn-sm">&#128202; Eksport</button>
      <button id="sync-btn" class="btn btn-primary btn-sm" style="display:none">&#8635; Sync</button>
      <div class="spacer"></div>
      <button id="rst-btn" class="btn btn-danger btn-sm">&#8634; Reset</button>
    </div>

  <div style="text-align:center;padding:20px 16px 12px;font-size:11px;color:var(--text-muted);border-top:1px solid var(--border-light);margin-top:30px">© 2026 Prijem Robe. Sva prava zadrzana.<br><a href="mailto:tomislav.vlahovic@bigbang.hr" style="color:var(--accent);text-decoration:none">tomislav.vlahovic@bigbang.hr</a> | <a href="https://wa.me/385915763877" style="color:var(--accent);text-decoration:none">+385 91 576 3877</a></div>
</div>

  <script src="js/github.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/scanner.js"></script>
  <script>
    if (!Auth.requireAuth()) throw 0;
    var il = document.getElementById("il");
    var pData = null, pSha = null, items = [], saveT = null;
    var pId = new URLSearchParams(window.location.search).get("id");
    if (!pId) window.location.href = "dashboard.html";

    var isOnline = navigator.onLine;
    var pendingSave = false;
    var localKey = "prijem_local_" + pId;
    var netBadge = document.getElementById("net-badge");
    var pendingInfo = document.getElementById("pending-info");
    var syncBtn = document.getElementById("sync-btn");

    // ========== ONLINE/OFFLINE DETECTION ==========
    function updateNetStatus() {
      isOnline = navigator.onLine;
      if (isOnline) {
        netBadge.className = "online-badge online";
        netBadge.innerHTML = '<span class="dot"></span>Online';
        // Auto-sync if there are pending changes
        if (pendingSave) { syncToGitHub(); }
      } else {
        netBadge.className = "online-badge offline";
        netBadge.innerHTML = '<span class="dot"></span>Offline';
      }
      updatePendingUI();
    }

    window.addEventListener("online", updateNetStatus);
    window.addEventListener("offline", updateNetStatus);

    function updatePendingUI() {
      if (pendingSave) {
        pendingInfo.textContent = "(nespremljene promjene)";
        syncBtn.style.display = isOnline ? "inline-flex" : "none";
      } else {
        pendingInfo.textContent = "";
        syncBtn.style.display = "none";
      }
    }

    // ========== LOCAL STORAGE ==========
    function saveLocal() {
      try {
        localStorage.setItem(localKey, JSON.stringify({ data: pData, sha: pSha, time: new Date().toISOString() }));
      } catch(e) { console.warn("Local save failed:", e); }
    }

    function loadLocal() {
      try {
        var saved = localStorage.getItem(localKey);
        if (saved) return JSON.parse(saved);
      } catch(e) {}
      return null;
    }

    // ========== LOAD PRIJEM ==========
    function load() {
      if (isOnline) {
        // Try loading from GitHub
        GitHubStorage.readFile("data/prijemi/" + Auth.getPoslovnicaId() + "/" + pId + ".json").then(function(d) {
          if (!d) {
            // Not on GitHub, try local
            var local = loadLocal();
            if (local) { initFromData(local.data, local.sha); return; }
            alert("Nije pronadjen"); window.location.href = "dashboard.html"; return;
          }
          // Check if local version is newer
          var local = loadLocal();
          if (local && local.data.azurirano && d.content.azurirano && new Date(local.data.azurirano) > new Date(d.content.azurirano)) {
            // Local is newer (was edited offline), use local but keep remote sha for next save
            initFromData(local.data, d.sha);
            pendingSave = true;
            updatePendingUI();
          } else {
            initFromData(d.content, d.sha);
          }
        }).catch(function(e) {
          console.warn("GitHub load failed, trying local:", e);
          var local = loadLocal();
          if (local) { initFromData(local.data, local.sha); toast("Offline - lokalni podaci", "error"); }
          else { alert("Greska: " + e.message); }
        });
      } else {
        // Offline - load from local
        var local = loadLocal();
        if (local) {
          initFromData(local.data, local.sha);
          toast("Offline nacin rada", "error");
        } else {
          alert("Nema internetske veze i nema lokalnih podataka.");
          window.location.href = "dashboard.html";
        }
      }
    }

    function initFromData(data, sha) {
      pData = data;
      pSha = sha;
      document.getElementById("dt").innerHTML = pData.dokumenti.map(function(d) { return d.naziv; }).join(", ") + '<span id="net-badge" class="online-badge ' + (isOnline ? "online" : "offline") + '"><span class="dot"></span>' + (isOnline ? "Online" : "Offline") + '</span>';
      netBadge = document.getElementById("net-badge");
      document.getElementById("dd").textContent = new Date(pData.datum).toLocaleDateString("hr-HR", { day:"numeric", month:"long", year:"numeric" }) + ".";
      items = [];
      for (var di = 0; di < pData.dokumenti.length; di++) {
        for (var si = 0; si < pData.dokumenti[di].stavke.length; si++) {
          var s = pData.dokumenti[di].stavke[si];
          items.push({ di: di, si: si, dn: pData.dokumenti[di].naziv, naziv: s.naziv, barkod: s.barkod, ocekivano: s.ocekivano, skenirano: s.skenirano || 0 });
        }
      }
      if (pData.status === "zavrsen") setFin(true);
      saveLocal(); // Cache locally
      render(); stats();
      Scanner.init("#si", "#sb", scan);
    }

    document.getElementById("edit-btn").addEventListener("click", function() {
      window.location.href = "priprema.html?id=" + pId;
    });

    var isLocked = false;

    function setFin(f) {
      isLocked = f;
      document.getElementById("fin-banner").style.display = f ? "flex" : "none";
      document.getElementById("fin-btn").style.display = f ? "none" : "";
      // Lock/unlock scan input
      var scanSection = document.querySelector(".scan-section");
      if (scanSection) scanSection.style.display = f ? "none" : "";
      // Lock/unlock qty inputs
      var qtyInputs = document.querySelectorAll(".qi");
      for (var i = 0; i < qtyInputs.length; i++) {
        qtyInputs[i].disabled = f;
        qtyInputs[i].style.opacity = f ? "0.5" : "1";
      }
      // Lock/unlock reset button
      document.getElementById("rst-btn").style.display = f ? "none" : "";
    }

    // ========== SCANNING ==========
    function barcodeMatch(itemBc, scanBc) {
      if (itemBc === scanBc) return true;
      // Match with/without leading zero
      if (itemBc === "0" + scanBc) return true;
      if (scanBc === "0" + itemBc) return true;
      return false;
    }

    function scan(bc) {
      if (isLocked) return { status: "not_found", barcode: "Prijem je zavrsen" };
      var it = null;
      for (var i = 0; i < items.length; i++) { if (barcodeMatch(items[i].barkod, bc) && items[i].skenirano < items[i].ocekivano) { it = items[i]; break; } }
      if (!it) { for (var i = items.length - 1; i >= 0; i--) { if (barcodeMatch(items[i].barkod, bc)) { it = items[i]; break; } } }
      if (!it) return { status: "not_found", barcode: bc };
      it.skenirano++; pData.dokumenti[it.di].stavke[it.si].skenirano = it.skenirano;
      var el = document.querySelector('[data-bc="' + it.barkod + '-' + it.di + '-' + it.si + '"]');
      if (el) { var inp = el.querySelector(".qi"); if (inp) inp.value = it.skenirano; updEl(el, it); el.classList.add("just-scanned"); setTimeout(function() { el.classList.remove("just-scanned"); }, 600); }
      stats(); schSave();
      return it.skenirano === it.ocekivano ? { status: "complete", naziv: it.naziv, skenirano: it.skenirano, ocekivano: it.ocekivano } : it.skenirano > it.ocekivano ? { status: "over", naziv: it.naziv, skenirano: it.skenirano, ocekivano: it.ocekivano } : { status: "ok", naziv: it.naziv, skenirano: it.skenirano, ocekivano: it.ocekivano };
    }

    window.qc = function(idx, val) {
      if (isLocked) return;
      var v = parseInt(val); if (isNaN(v) || v < 0) return;
      items[idx].skenirano = v; pData.dokumenti[items[idx].di].stavke[items[idx].si].skenirano = v;
      var els = document.querySelectorAll(".article-item");
      if (els[idx]) updEl(els[idx], items[idx]);
      stats(); schSave();
    };

    function updEl(el, it) {
      var diff = it.skenirano - it.ocekivano;
      var st = it.skenirano === 0 ? "none" : it.skenirano < it.ocekivano ? "partial" : it.skenirano === it.ocekivano ? "ok" : "over";
      var ic = el.querySelector(".article-icon");
      ic.className = "article-icon status-" + st;
      ic.textContent = st === "ok" ? "\u2713" : st === "partial" ? "\u25D0" : st === "over" ? "!" : "\u25CB";
      var dd = el.querySelector(".dd");
      if (dd) dd.innerHTML = diff !== 0 ? '<span class="diff ' + (diff > 0 ? "positive" : "negative") + '" style="font-size:12px;font-weight:700">' + (diff > 0 ? "+" + diff : diff) + "</span>" : "";
      var isDark = document.documentElement.getAttribute("data-theme") === "dark";
      el.style.background = st === "ok" ? (isDark ? "rgba(34,197,94,0.08)" : "#f8fef9") : st === "over" ? (isDark ? "rgba(245,158,11,0.08)" : "#fffcf5") : "";
    }

    function render() {
      il.innerHTML = ""; var cd = null;
      for (var idx = 0; idx < items.length; idx++) {
        (function(it, i) {
          if (it.dn !== cd) {
            cd = it.dn;
            // Calculate doc stats
            var dSken = 0, dOcek = 0;
            for (var di2 = 0; di2 < items.length; di2++) { if (items[di2].dn === cd) { dSken += items[di2].skenirano; dOcek += items[di2].ocekivano; } }
            var dSt = dSken === 0 ? "none" : dSken < dOcek ? "partial" : "ok";
            var dCol = dSt === "ok" ? "var(--success)" : dSt === "partial" ? "var(--warning)" : "var(--danger)";
            var dIc = dSt === "ok" ? "\u2713" : dSt === "partial" ? "\u25D0" : "\u25CB";
            var dIdx = it.di;
            var s = document.createElement("div"); s.className = "doc-separator"; s.style.display = "flex"; s.style.alignItems = "center";
            s.innerHTML = '<span style="color:' + dCol + ';margin-right:6px">' + dIc + '</span><span style="flex:1">\u{1F4C4} ' + cd + ' <span style="font-weight:400">(' + dSken + '/' + dOcek + ')</span></span><button onclick="deleteDocFromPrijem(' + dIdx + ')" style="background:none;border:none;color:var(--danger);cursor:pointer;font-size:13px" title="Obrisi dokument">\u2715</button>';
            il.appendChild(s);
          }
          var diff = it.skenirano - it.ocekivano;
          var st = it.skenirano === 0 ? "none" : it.skenirano < it.ocekivano ? "partial" : it.skenirano === it.ocekivano ? "ok" : "over";
          var si = st === "ok" ? "\u2713" : st === "partial" ? "\u25D0" : st === "over" ? "!" : "\u25CB";
          var dt = diff !== 0 ? '<span class="diff ' + (diff > 0 ? "positive" : "negative") + '" style="font-size:12px;font-weight:700">' + (diff > 0 ? "+" + diff : diff) + "</span>" : "";
          var el = document.createElement("div"); el.className = "article-item"; el.setAttribute("data-bc", it.barkod + "-" + it.di + "-" + it.si);
          var isDk = document.documentElement.getAttribute("data-theme") === "dark";
          if (st === "ok") el.style.background = isDk ? "rgba(34,197,94,0.08)" : "#f8fef9"; if (st === "over") el.style.background = isDk ? "rgba(245,158,11,0.08)" : "#fffcf5";
          el.innerHTML = '<div class="article-icon status-' + st + '">' + si + '</div><div class="article-info"><div class="name" title="' + it.naziv + '">' + it.naziv + '</div><div class="barcode">' + it.barkod + '</div></div><div class="article-count"><input type="text" inputmode="numeric" pattern="[0-9]*" class="qty-input-inline qi" value="' + it.skenirano + '" onfocus="this.select()" onchange="qc(' + i + ',this.value)" onblur="qc(' + i + ',this.value)"><span style="color:var(--text-muted);font-size:14px">/' + it.ocekivano + '</span></div><div class="dd" style="min-width:32px;text-align:right">' + dt + "</div>";
          il.appendChild(el);
        })(items[idx], idx);
      }
    }

    function stats() {
      var te = 0, ts = 0;
      for (var i = 0; i < items.length; i++) { te += items[i].ocekivano; ts += items[i].skenirano; }
      var td = ts - te;
      document.getElementById("ss").textContent = ts; document.getElementById("se").textContent = te;
      document.getElementById("sd").textContent = td === 0 ? "0" : (td > 0 ? "+" + td : td);
      var sdc = document.getElementById("sdc");
      if (td === 0 && ts > 0) { sdc.style.borderLeftColor = "#34c759"; sdc.style.background = "var(--success-bg)"; document.getElementById("sd").style.color = "#34c759"; }
      else { sdc.style.borderLeftColor = "#ff3b30"; sdc.style.background = "var(--danger-bg)"; document.getElementById("sd").style.color = "#ff3b30"; }
    }

    // ========== SAVE (LOCAL + GITHUB) ==========
    function schSave() { clearTimeout(saveT); saveT = setTimeout(save, 2000); }

    function save() {
      pData.azurirano = new Date().toISOString();
      saveLocal(); // Always save locally first

      if (isOnline) {
        return syncToGitHub();
      } else {
        pendingSave = true;
        updatePendingUI();
        return Promise.resolve();
      }
    }

    function syncToGitHub() {
      return GitHubStorage.writeFile("data/prijemi/" + Auth.getPoslovnicaId() + "/" + pId + ".json", pData, "Sken", pSha).then(function(r) {
        if (r) pSha = r.content.sha;
        pendingSave = false;
        updatePendingUI();
        saveLocal(); // Update local with new sha
      }).catch(function(e) {
        console.error("Sync failed:", e);
        pendingSave = true;
        updatePendingUI();
      });
    }

    // Manual sync button
    syncBtn.addEventListener("click", function() {
      syncBtn.textContent = "Syncing..."; syncBtn.disabled = true;
      syncToGitHub().then(function() {
        toast("Sinkronizirano!", "success");
      }).catch(function() {
        toast("Sync neuspjesan", "error");
      }).then(function() {
        syncBtn.textContent = "\u21BB Sync"; syncBtn.disabled = false;
      });
    });

    // ========== FINISH / REOPEN / RESET ==========
    document.getElementById("fin-btn").addEventListener("click", function() {
      var dc = 0, td = 0;
      for (var i = 0; i < items.length; i++) { if (items[i].skenirano !== items[i].ocekivano) { dc++; td += Math.abs(items[i].skenirano - items[i].ocekivano); } }
      var msg = dc ? "Razlike: " + dc + " artikala, " + td + " kom.\n\nZavrsiti ipak?" : "Zavrsiti prijem?";
      if (!confirm(msg)) return;
      pData.status = "zavrsen"; pData.zavrseno = new Date().toISOString();
      save().then(function() { setFin(true); toast("Zavrseno!", "success"); });
    });

    document.getElementById("reopen-btn").addEventListener("click", function() {
      pData.status = "aktivan"; delete pData.zavrseno;
      save().then(function() { setFin(false); render(); stats(); toast("Nastavljeno", "success"); Scanner.refocus(); });
    });

    document.getElementById("rst-btn").addEventListener("click", function() {
      if (!confirm("Resetirati sva skeniranja?")) return;
      for (var i = 0; i < items.length; i++) { items[i].skenirano = 0; pData.dokumenti[items[i].di].stavke[items[i].si].skenirano = 0; }
      render(); stats(); save().then(function() { Scanner.refocus(); });
    });

    // ========== EXPORT ==========
    document.getElementById("exp-btn").addEventListener("click", function() {
      var xml = '<?xml version="1.0" encoding="UTF-8"?>\n';
      xml += '<?mso-application progid="Excel.Sheet"?>\n';
      xml += '<Workbook xmlns="urn:schemas-microsoft-com:office:spreadsheet" xmlns:ss="urn:schemas-microsoft-com:office:spreadsheet">\n';
      xml += '<Styles>\n';
      xml += '<Style ss:ID="header"><Interior ss:Color="#DBEAFE" ss:Pattern="Solid"/><Font ss:Bold="1" ss:Color="#1E3A5F"/><Alignment ss:Horizontal="Center"/><Borders><Border ss:Position="Bottom" ss:LineStyle="Continuous" ss:Weight="2"/></Borders></Style>\n';
      xml += '<Style ss:ID="def"></Style>\n';
      xml += '<Style ss:ID="defSep"><Borders><Border ss:Position="Bottom" ss:LineStyle="Continuous" ss:Weight="2"/></Borders></Style>\n';
      xml += '<Style ss:ID="ok"><Interior ss:Color="#D1FAE5" ss:Pattern="Solid"/><Font ss:Bold="1" ss:Color="#166534"/></Style>\n';
      xml += '<Style ss:ID="okSep"><Interior ss:Color="#D1FAE5" ss:Pattern="Solid"/><Font ss:Bold="1" ss:Color="#166534"/><Borders><Border ss:Position="Bottom" ss:LineStyle="Continuous" ss:Weight="2"/></Borders></Style>\n';
      xml += '<Style ss:ID="minus"><Interior ss:Color="#FEE2E2" ss:Pattern="Solid"/><Font ss:Bold="1" ss:Color="#DC2626"/></Style>\n';
      xml += '<Style ss:ID="minusSep"><Interior ss:Color="#FEE2E2" ss:Pattern="Solid"/><Font ss:Bold="1" ss:Color="#DC2626"/><Borders><Border ss:Position="Bottom" ss:LineStyle="Continuous" ss:Weight="2"/></Borders></Style>\n';
      xml += '<Style ss:ID="plus"><Interior ss:Color="#FEF3C7" ss:Pattern="Solid"/><Font ss:Bold="1" ss:Color="#D97706"/></Style>\n';
      xml += '<Style ss:ID="plusSep"><Interior ss:Color="#FEF3C7" ss:Pattern="Solid"/><Font ss:Bold="1" ss:Color="#D97706"/><Borders><Border ss:Position="Bottom" ss:LineStyle="Continuous" ss:Weight="2"/></Borders></Style>\n';
      xml += '</Styles>\n';
      xml += '<Worksheet ss:Name="Prijem">\n<Table>\n';
      xml += '<Column ss:Width="140"/><Column ss:Width="300"/><Column ss:Width="110"/><Column ss:Width="80"/><Column ss:Width="80"/><Column ss:Width="70"/>\n';
      // Header
      xml += '<Row>';
      var headers = ["Dokument","Naziv","Barkod","Ocekivano","Skenirano","Razlika"];
      for (var h = 0; h < headers.length; h++) xml += '<Cell ss:StyleID="header"><Data ss:Type="String">' + headers[h] + '</Data></Cell>';
      xml += '</Row>\n';
      // Data rows
      for (var i = 0; i < items.length; i++) {
        var it = items[i];
        var diff = it.skenirano - it.ocekivano;
        // Check if this is the last item of its document
        var isLastInDoc = (i === items.length - 1) || (items[i + 1].dn !== it.dn);
        var rowStyle = isLastInDoc ? "defSep" : "def";
        var diffStyle;
        if (diff === 0 && it.skenirano > 0) diffStyle = isLastInDoc ? "okSep" : "ok";
        else if (diff < 0) diffStyle = isLastInDoc ? "minusSep" : "minus";
        else if (diff > 0) diffStyle = isLastInDoc ? "plusSep" : "plus";
        else diffStyle = rowStyle;
        xml += '<Row>';
        xml += '<Cell ss:StyleID="' + rowStyle + '"><Data ss:Type="String">' + esc(it.dn) + '</Data></Cell>';
        xml += '<Cell ss:StyleID="' + rowStyle + '"><Data ss:Type="String">' + esc(it.naziv) + '</Data></Cell>';
        xml += '<Cell ss:StyleID="' + rowStyle + '"><Data ss:Type="String">' + it.barkod + '</Data></Cell>';
        xml += '<Cell ss:StyleID="' + rowStyle + '"><Data ss:Type="Number">' + it.ocekivano + '</Data></Cell>';
        xml += '<Cell ss:StyleID="' + rowStyle + '"><Data ss:Type="Number">' + it.skenirano + '</Data></Cell>';
        xml += '<Cell ss:StyleID="' + diffStyle + '"><Data ss:Type="Number">' + diff + '</Data></Cell>';
        xml += '</Row>\n';
      }
      xml += '</Table>\n</Worksheet>\n</Workbook>';
      var fileName = "prijem-" + (pData.naziv || pData.datum) + ".xls";
      fileName = fileName.replace(/[^a-zA-Z0-9\-_.]/g, "_");
      var a = document.createElement("a");
      a.href = URL.createObjectURL(new Blob([xml], { type: "application/vnd.ms-excel;charset=utf-8" }));
      a.download = fileName; a.click();
    });

    function esc(s) { return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;"); }

    window.deleteDocFromPrijem = function(docIdx) {
      if (!pData || !pData.dokumenti[docIdx]) return;
      if (!confirm("Obrisati dokument " + pData.dokumenti[docIdx].naziv + "?")) return;
      pData.dokumenti.splice(docIdx, 1);
      // Rebuild items array
      items = [];
      for (var di = 0; di < pData.dokumenti.length; di++) {
        for (var si = 0; si < pData.dokumenti[di].stavke.length; si++) {
          var s = pData.dokumenti[di].stavke[si];
          items.push({ di: di, si: si, dn: pData.dokumenti[di].naziv, naziv: s.naziv, barkod: s.barkod, ocekivano: s.ocekivano, skenirano: s.skenirano || 0 });
        }
      }
      render(); stats(); save().then(function() { toast("Dokument obrisan!", "success"); });
    };

    function toast(m, t) { var old = document.querySelectorAll(".toast"); for(var i=0;i<old.length;i++) old[i].remove(); var el = document.createElement("div"); el.className = "toast " + t; el.textContent = m; document.body.appendChild(el); setTimeout(function() { el.remove(); }, 3000); }
    if(localStorage.getItem("theme")==="dark") document.getElementById("theme-toggle").classList.add("dark");

    // ========== INIT ==========
    updateNetStatus();
    load();

    // Periodically check connection and auto-sync
    setInterval(function() {
      var wasOnline = isOnline;
      isOnline = navigator.onLine;
      if (isOnline !== wasOnline) updateNetStatus();
    }, 5000);
  </script>
</body>
</html>

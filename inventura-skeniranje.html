<!DOCTYPE html>
<html lang="hr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Inventura - Skeniranje</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="icon" href="icons/favicon.png" type="image/png">
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#007aff">
  <style>
    @media(max-width:500px){
      .page-header{flex-wrap:wrap;gap:8px}
      .page-header .title-group h1{font-size:16px}
      .page-header .header-action{width:100%;display:flex;gap:6px}
      .page-header .header-action .btn{flex:1}
      .stat-card{padding:10px 6px}.stat-card .value{font-size:20px}
      .article-item{padding:10px 12px;gap:8px}
      .article-info .name{font-size:12px}
      .qi{width:40px;font-size:14px;padding:4px 1px}
      .scan-input-row input{font-size:16px;padding:12px}
    }
    .part-select{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:10px;margin:16px 0}
    .part-btn{padding:16px;border:2px solid var(--border);border-radius:12px;background:var(--bg-white);cursor:pointer;text-align:center;transition:all .2s;font-family:var(--font)}
    .part-btn:hover{border-color:#34c759;background:var(--bg-input)}
    .part-btn .part-num{font-size:28px;font-weight:700;color:#34c759}
    .part-btn .part-name{font-size:14px;font-weight:600;margin-top:4px}
    .part-btn .part-info{font-size:11px;color:var(--text-muted);margin-top:4px}
  </style>
</head>
<body>
  <script>if(localStorage.getItem("theme")==="dark")document.documentElement.setAttribute("data-theme","dark");</script>
  <div class="app">
    <div class="page-header">
      <button class="back-btn" onclick="smartBack()">&#8592;</button>
      <div class="title-group">
        <h1 id="dt">&#128203; Ucitavanje...</h1>
        <p id="dd"></p>
      </div>
      <div class="header-action" style="display:flex;gap:6px;align-items:center">
        <div class="theme-toggle" id="theme-toggle" onclick="var d=document.documentElement.getAttribute('data-theme')==='dark';if(d){document.documentElement.removeAttribute('data-theme');this.classList.remove('dark');localStorage.setItem('theme','light')}else{document.documentElement.setAttribute('data-theme','dark');this.classList.add('dark');localStorage.setItem('theme','dark')}if(typeof render==='function'){setTimeout(render,50);}"></div>
        <button id="fin-btn" class="btn btn-success btn-sm" style="display:none">&#10003; Zavrsi dio</button>
      </div>
    </div>

    <div id="part-select-view">
      <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:4px;flex-wrap:wrap;gap:8px">
        <div style="font-size:16px;font-weight:700">Odaberi dio za skeniranje:</div>
        <button id="add-part-btn" class="btn btn-sm" style="background:#34c759;color:#fff;border-color:#34c759">+ Dodaj dio</button>
      </div>
      <div id="part-select" class="part-select"></div>
    </div>

    <div id="scan-view" style="display:none">
      <div id="fin-banner" class="finished-banner" style="display:none">
        <span class="text">&#10003; Dio zavrsen</span>
        <button id="reopen-btn" class="btn btn-secondary btn-sm">Nastavi</button>
      </div>

      <div class="stats-row">
        <div class="stat-card" style="border-left:4px solid #007aff"><div class="value" id="ss">0</div><div class="label">Skenirano</div></div>
        <div class="stat-card" style="border-left:4px solid #ff9500"><div class="value" id="se">0</div><div class="label">Ocekivano</div></div>
        <div class="stat-card" id="sdc" style="border-left:4px solid #ff3b30"><div class="value" id="sd">0</div><div class="label">Razlika</div></div>
      </div>

      <div id="sb" class="scan-banner"></div>

      <div class="scan-section">
        <div style="margin-bottom:8px;font-size:13px;color:var(--text-secondary);font-weight:500">Barkod unos:</div>
        <div class="scan-input-row">
          <input type="text" id="si" placeholder="Skeniraj ili upisi barkod..." autocomplete="off" autofocus>
        </div>
      </div>

      <div class="article-list-section">
        <div class="article-list-header">Artikli</div>
        <div id="il"></div>
      </div>

      <div style="margin-top:12px;display:flex;gap:8px">
        <button id="back-parts" class="btn btn-secondary btn-sm">&#8592; Natrag na dijelove</button>
        <div class="spacer"></div>
        <button id="rst-btn" class="btn btn-danger btn-sm">&#8634; Reset</button>
      </div>
    </div>
  </div>

  <script src="js/github.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/scanner.js"></script>
  <script>
    if (!Auth.requireAuth()) throw 0;
    var invId = new URLSearchParams(window.location.search).get("id");
    if (!invId) window.location.href = "inventura.html";

    var il = document.getElementById("il");
    var invData = null, partData = null, partSha = null, partPath = null;
    var items = [], saveT = null, isLocked = false;
    var pid = Auth.getPoslovnicaId();
    var folder = "data/inventure/" + pid + "/";

    GitHubStorage.readFile(folder + invId + ".json").then(function(d) {
      if (!d) { alert("Nije pronadjena"); window.location.href = "inventura.html"; return; }
      invData = d.content;
      document.getElementById("dt").innerHTML = "&#128203; " + (invData.naziv || "Inventura");
      document.getElementById("dd").textContent = new Date(invData.datum).toLocaleDateString("hr-HR", { day:"numeric", month:"long", year:"numeric" }) + ".";
      showParts();
    });

    function showParts() {
      document.getElementById("part-select-view").style.display = "block";
      document.getElementById("scan-view").style.display = "none";
      document.getElementById("fin-btn").style.display = "none";
      var ps = document.getElementById("part-select"); ps.innerHTML = "";
      for (var i = 0; i < (invData.dijelovi || []).length; i++) {
        (function(dio, idx) {
          var btn = document.createElement("div"); btn.className = "part-btn";
          btn.id = "partcard-" + dio.id;
          btn.innerHTML = '<div class="part-num">' + (idx+1) + '</div><div class="part-name">' + dio.naziv + '</div><div class="part-info" id="partinfo-' + dio.id + '">Ucitavanje...</div>';
          btn.addEventListener("click", function() { loadPart(dio); });
          ps.appendChild(btn);
          // Load part status + scan count
          GitHubStorage.readFile(folder + invId + "-dio-" + dio.id + ".json").then(function(d) {
            var info = document.getElementById("partinfo-" + dio.id);
            var card = document.getElementById("partcard-" + dio.id);
            if (!info || !d) { if (info) info.textContent = "Klikni za skeniranje"; return; }
            var sken = 0;
            for (var dd = 0; dd < d.content.dokumenti.length; dd++) { for (var ss = 0; ss < d.content.dokumenti[dd].stavke.length; ss++) sken += (d.content.dokumenti[dd].stavke[ss].skenirano || 0); }
            if (d.content.status === "zavrsen") {
              info.innerHTML = '<span style="color:#34c759;font-weight:700">\u2713 Zavrseno</span> &middot; ' + sken + ' kom';
              if (card) card.style.borderColor = "#34c759";
            } else {
              info.textContent = sken > 0 ? (sken + " kom skenirano") : "Klikni za skeniranje";
            }
          }).catch(function(){});
        })(invData.dijelovi[i], i);
      }
    }

    function loadPart(dio) {
      partPath = folder + invId + "-dio-" + dio.id + ".json";
      GitHubStorage.readFile(partPath).then(function(d) {
        if (!d) { toast("Dio nije pronadjen", "error"); return; }
        partData = d.content; partSha = d.sha;
        items = [];
        for (var di = 0; di < partData.dokumenti.length; di++) {
          for (var si = 0; si < partData.dokumenti[di].stavke.length; si++) {
            var s = partData.dokumenti[di].stavke[si];
            items.push({ di: di, si: si, dn: partData.dokumenti[di].naziv, naziv: s.naziv, barkod: s.barkod, ocekivano: s.ocekivano, skenirano: s.skenirano || 0 });
          }
        }
        document.getElementById("part-select-view").style.display = "none";
        document.getElementById("scan-view").style.display = "block";
        document.getElementById("fin-btn").style.display = "";
        document.getElementById("dd").textContent = "Dio: " + dio.naziv;
        render(); stats();
        Scanner.init("#si", "#sb", scan);
        setFin(partData.status === "zavrsen");
      });
    }

    window.smartBack = function() {
      // If currently scanning a part, go back to part selection; otherwise leave to list
      var scanViewVisible = document.getElementById("scan-view").style.display !== "none";
      if (scanViewVisible) {
        document.getElementById("dd").textContent = new Date(invData.datum).toLocaleDateString("hr-HR", { day:"numeric", month:"long", year:"numeric" }) + ".";
        showParts();
      } else {
        window.location.href = "inventura.html";
      }
    };

    document.getElementById("back-parts").addEventListener("click", function() {
      document.getElementById("dd").textContent = new Date(invData.datum).toLocaleDateString("hr-HR", { day:"numeric", month:"long", year:"numeric" }) + ".";
      showParts();
    });

    document.getElementById("add-part-btn").addEventListener("click", function() {
      var naziv = prompt("Naziv novog dijela (npr. Skener 5):");
      if (naziv === null) return;
      naziv = naziv.trim();
      if (!naziv) { toast("Unesi naziv", "error"); return; }

      var btn = document.getElementById("add-part-btn");
      btn.textContent = "Dodajem..."; btn.disabled = true;

      // Re-read main inventura to get fresh sha, then add part
      GitHubStorage.readFile(folder + invId + ".json").then(function(d) {
        if (!d) throw new Error("Inventura nije pronadjena");
        var inv = d.content;
        var newDio = { id: "dio" + Date.now(), naziv: naziv };
        if (!inv.dijelovi) inv.dijelovi = [];
        inv.dijelovi.push(newDio);
        inv.azurirano = new Date().toISOString();

        // Build part file with same articles, all scanned = 0
        var partDok = JSON.parse(JSON.stringify(inv.dokumenti));
        for (var dd = 0; dd < partDok.length; dd++) { for (var ss = 0; ss < partDok[dd].stavke.length; ss++) partDok[dd].stavke[ss].skenirano = 0; }
        var partData = { id: invId + "-dio-" + newDio.id, inventuraId: invId, dio: naziv, dokumenti: partDok };

        // Save main file first, then part file
        return GitHubStorage.writeFile(folder + invId + ".json", inv, "Dodan dio: " + naziv, d.sha).then(function() {
          return GitHubStorage.writeFile(folder + invId + "-dio-" + newDio.id + ".json", partData, "Novi dio: " + naziv);
        }).then(function() {
          invData = inv; // update local copy
        });
      }).then(function() {
        toast("Dio dodan!", "success");
        showParts();
      }).catch(function(e) {
        toast("Greska: " + e.message, "error");
      }).then(function() {
        btn.textContent = "+ Dodaj dio"; btn.disabled = false;
      });
    });

    function barcodeMatch(itemBc, scanBc) {
      if (itemBc === scanBc) return true;
      if (itemBc === "0" + scanBc) return true;
      if (scanBc === "0" + itemBc) return true;
      return false;
    }

    function scan(bc) {
      if (isLocked) return { status: "not_found", barcode: "Dio je zavrsen" };
      var it = null;
      for (var i = 0; i < items.length; i++) { if (barcodeMatch(items[i].barkod, bc) && items[i].skenirano < items[i].ocekivano) { it = items[i]; break; } }
      if (!it) { for (var i = items.length - 1; i >= 0; i--) { if (barcodeMatch(items[i].barkod, bc)) { it = items[i]; break; } } }
      if (!it) return { status: "not_found", barcode: bc };
      it.skenirano++; partData.dokumenti[it.di].stavke[it.si].skenirano = it.skenirano;
      var el = document.querySelector('[data-bc="' + it.barkod + '-' + it.di + '-' + it.si + '"]');
      if (el) { var inp = el.querySelector(".qi"); if (inp) inp.value = it.skenirano; updEl(el, it); el.classList.add("just-scanned"); setTimeout(function() { el.classList.remove("just-scanned"); }, 600); }
      stats(); schSave();
      return it.skenirano === it.ocekivano ? { status: "complete", naziv: it.naziv, skenirano: it.skenirano, ocekivano: it.ocekivano } : it.skenirano > it.ocekivano ? { status: "over", naziv: it.naziv, skenirano: it.skenirano, ocekivano: it.ocekivano } : { status: "ok", naziv: it.naziv, skenirano: it.skenirano, ocekivano: it.ocekivano };
    }

    window.qc = function(idx, val) {
      if (isLocked) return;
      var v = parseInt(val); if (isNaN(v) || v < 0) return;
      items[idx].skenirano = v; partData.dokumenti[items[idx].di].stavke[items[idx].si].skenirano = v;
      var els = document.querySelectorAll(".article-item");
      if (els[idx]) updEl(els[idx], items[idx]);
      stats(); schSave();
    };

    function updEl(el, it) {
      var diff = it.skenirano - it.ocekivano;
      var st = it.skenirano === 0 ? "none" : it.skenirano < it.ocekivano ? "partial" : it.skenirano === it.ocekivano ? "ok" : "over";
      var ic = el.querySelector(".article-icon");
      ic.className = "article-icon status-" + st;
      ic.textContent = st === "ok" ? "\u2713" : st === "partial" ? "\u25D0" : st === "over" ? "!" : "\u25CB";
      var dd = el.querySelector(".dd");
      if (dd) dd.innerHTML = diff !== 0 ? '<span class="diff ' + (diff > 0 ? "positive" : "negative") + '" style="font-size:12px;font-weight:700">' + (diff > 0 ? "+" + diff : diff) + "</span>" : "";
      var isDk = document.documentElement.getAttribute("data-theme") === "dark";
      el.style.background = st === "ok" ? (isDk ? "rgba(34,197,94,0.08)" : "#f8fef9") : st === "over" ? (isDk ? "rgba(245,158,11,0.08)" : "#fffcf5") : "";
    }

    function render() {
      il.innerHTML = "";
      for (var idx = 0; idx < items.length; idx++) {
        (function(it, i) {
          var diff = it.skenirano - it.ocekivano;
          var st = it.skenirano === 0 ? "none" : it.skenirano < it.ocekivano ? "partial" : it.skenirano === it.ocekivano ? "ok" : "over";
          var si = st === "ok" ? "\u2713" : st === "partial" ? "\u25D0" : st === "over" ? "!" : "\u25CB";
          var dt = diff !== 0 ? '<span class="diff ' + (diff > 0 ? "positive" : "negative") + '" style="font-size:12px;font-weight:700">' + (diff > 0 ? "+" + diff : diff) + "</span>" : "";
          var el = document.createElement("div"); el.className = "article-item"; el.setAttribute("data-bc", it.barkod + "-" + it.di + "-" + it.si);
          var isDk = document.documentElement.getAttribute("data-theme") === "dark";
          if (st === "ok") el.style.background = isDk ? "rgba(34,197,94,0.08)" : "#f8fef9";
          if (st === "over") el.style.background = isDk ? "rgba(245,158,11,0.08)" : "#fffcf5";
          el.innerHTML = '<div class="article-icon status-' + st + '">' + si + '</div><div class="article-info"><div class="name" title="' + it.naziv + '">' + it.naziv + '</div><div class="barcode">' + it.barkod + '</div></div><div class="article-count"><input type="text" inputmode="numeric" pattern="[0-9]*" class="qty-input-inline qi" value="' + it.skenirano + '" onfocus="this.select()" onchange="qc(' + i + ',this.value)" onblur="qc(' + i + ',this.value)"><span style="color:var(--text-muted);font-size:14px">/' + it.ocekivano + '</span></div><div class="dd" style="min-width:32px;text-align:right">' + dt + "</div>";
          il.appendChild(el);
        })(items[idx], idx);
      }
    }

    function stats() {
      var te = 0, ts = 0;
      for (var i = 0; i < items.length; i++) { te += items[i].ocekivano; ts += items[i].skenirano; }
      var td = ts - te;
      document.getElementById("ss").textContent = ts; document.getElementById("se").textContent = te;
      document.getElementById("sd").textContent = td === 0 ? "0" : (td > 0 ? "+" + td : td);
      var sdc = document.getElementById("sdc");
      if (td === 0 && ts > 0) { sdc.style.borderLeftColor = "#34c759"; document.getElementById("sd").style.color = "#34c759"; }
      else { sdc.style.borderLeftColor = "#ff3b30"; document.getElementById("sd").style.color = "#ff3b30"; }
    }

    function schSave() { clearTimeout(saveT); saveT = setTimeout(save, 2000); }
    function save() {
      return GitHubStorage.writeFile(partPath, partData, "Inventura sken", partSha).then(function(r) {
        if (r) partSha = r.content.sha;
      }).catch(function(e) { console.error("Save error:", e); });
    }

    function setFin(f) {
      isLocked = f;
      document.getElementById("fin-banner").style.display = f ? "flex" : "none";
      document.getElementById("fin-btn").style.display = f ? "none" : "";
      var scanSection = document.querySelector(".scan-section");
      if (scanSection) scanSection.style.display = f ? "none" : "";
      var qtyInputs = document.querySelectorAll(".qi");
      for (var i = 0; i < qtyInputs.length; i++) { qtyInputs[i].disabled = f; qtyInputs[i].style.opacity = f ? "0.5" : "1"; }
      document.getElementById("rst-btn").style.display = f ? "none" : "";
    }

    document.getElementById("fin-btn").addEventListener("click", function() {
      if (!confirm("Zavrsiti ovaj dio inventure?")) return;
      partData.status = "zavrsen";
      save().then(function() { setFin(true); toast("Zavrseno!", "success"); });
    });

    document.getElementById("reopen-btn").addEventListener("click", function() {
      partData.status = "aktivan";
      setFin(false); render(); stats(); save().then(function() { toast("Nastavljeno", "success"); Scanner.refocus(); });
    });

    document.getElementById("rst-btn").addEventListener("click", function() {
      if (!confirm("Resetirati sva skeniranja za ovaj dio?")) return;
      for (var i = 0; i < items.length; i++) { items[i].skenirano = 0; partData.dokumenti[items[i].di].stavke[items[i].si].skenirano = 0; }
      render(); stats(); save().then(function() { Scanner.refocus(); });
    });

    function toast(m, t) { var old = document.querySelectorAll(".toast"); for(var i=0;i<old.length;i++) old[i].remove(); var el = document.createElement("div"); el.className = "toast " + t; el.textContent = m; document.body.appendChild(el); setTimeout(function() { el.remove(); }, 3000); }
    if(localStorage.getItem("theme")==="dark") document.getElementById("theme-toggle").classList.add("dark");
  </script>
</body>
</html>
